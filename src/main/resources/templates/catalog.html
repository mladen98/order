<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Katalog</title>
</head>
<body>
<h1>Artikelsuche</h1>

<form th:action="@{/}" method="get">
    <input type="text" name="q" th:value="${query}" placeholder="Titel, Autor, Beschreibung"/>
    <button type="submit">Suchen</button>
</form>

<h2 th:if="${#lists.isEmpty(results) == false}">Resultate</h2>
<table th:if="${#lists.isEmpty(results) == false}" border="1" cellpadding="6">
    <thead>
    <tr><th>ISBN</th><th>Titel</th><th>Autor</th><th>Beschreibung</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="b : ${results}">
        <td th:text="${b.isbn}"></td>
        <td th:text="${b.title}"></td>
        <td th:text="${#strings.listJoin(b.authors, ', ')}"></td>
        <td th:text="${b.description}"></td>
        <td>
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="isbn" th:value="${b.isbn}"/>
                <button type="submit">Zum Warenkorb</button>
            </form>
        </td>

    </tr>
    </tbody>
</table>

<h2>Warenkorb <span th:text="'(' + ${cartCount} + ' Artikel)'"></span></h2>
<table border="1" cellpadding="6">
    <thead>
    <tr><th>Titel</th><th>Menge</th></tr>
    </thead>
    <tbody>
    <!-- Wenn der Warenkorb leer ist -->
    <tr th:if="${#lists.isEmpty(cart)}">
        <td colspan="2">Noch keine Artikel im Warenkorb</td>
    </tr>

    <!-- Wenn Artikel drin sind -->
    <tr th:each="ci : ${cart}">
        <td th:text="${ci.book.title}"></td>
        <td th:text="${ci.qty}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
