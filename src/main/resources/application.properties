spring.application.name=order
server.port=8081
catalog.base-url=http://localhost:8080
# === Resilience4j Retry für den Catalog-Aufruf ===
# Name "catalogSearch" wird im @Retry-Annotation verwendet
resilience4j.retry.instances.catalogSearch.max-attempts=3
resilience4j.retry.instances.catalogSearch.wait-duration=500ms
