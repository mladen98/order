spring.application.name=order
server.port=8081
catalog.base-url=http://localhost:8080
# Resilience4j Retry fuer den Catalog-Aufruf
# Name catalogSearch wird in der Retry Annotation verwendet
resilience4j.retry.instances.catalogSearch.max-attempts=3
resilience4j.retry.instances.catalogSearch.wait-duration=500ms

# Actuator - alle Endpoints freigeben
management.endpoints.web.exposure.include=*

