version: "3.9"

services:
  catalog:
    image: catalog:0.0.1-SNAPSHOT
    container_name: catalog-service
    ports:
      - "8080:8080"
    networks:
      - app-net

  order:
    image: order:0.0.1-SNAPSHOT
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - catalog
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
