version: "3.9"

services:
  catalog:
    build: ../catalog        # Dockerfile im catalog-Projekt
    container_name: catalog-service
    ports:
      - "8080:8080"
    networks:
      - app-net

  order:
    build: .                 # Dockerfile im aktuellen (order-)Projekt
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - catalog
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
