version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: catalog-postgres
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    networks:
      - app-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  catalog:
    build: ../catalog        # Dockerfile im catalog-Projekt
    container_name: catalog-service
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog

  order:
    build: .                 # Dockerfile im aktuellen (order-)Projekt
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - catalog
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata: