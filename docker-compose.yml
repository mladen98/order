# Definieren der Dienste: Postgres-Datenbank, Katalog-Service und Bestell-Service
services:
  postgres:
    image: postgres:16
    container_name: catalog-postgres
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
      options: >-
        --health-cmd="pg_isready -U catalog"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5
        
        steps:
          # Other steps ...
          - name: Wait for PostgreSQL
            run: |
              for i in $(seq 1 30); do
                nc -z localhost 5432 && echo "Postgres is UP" && exit 0
                sleep 1
              done
              echo "Postgres did not start in time" && exit 1
    ports:
      - "5432:5432"
    networks:
      - app-net
    volumes:
      - pgdata:/var/lib/postgresql/data


# Katalog-Service
  catalog:
    image: ksrigganthan/catalog:latest # Dockerfile Catalog vom Docker Hub holen
    container_name: catalog-service
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog # Docker DNS gibt jedem Service den Servicenamen als Hostname (keine IP-Adressen verwenden)
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog

# Bestell-Service
  order:
    image: ksrigganthan/order:latest    # Dockerfile im aktuellen (order-)Projekt
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - catalog
    networks:
      - app-net
    environment:
      CATALOG_BASE_URL: http://catalog:8080 #Localhost wäre hier falsch, da es sich um einen anderen Container handelt (immer mit dem Servicenamen ansprechen)
# Definieren des Netzwerks und Volumes
networks: # Wie eine Art Mini-Lan damit die Services sich untereinander erreichen können
  app-net:
    driver: bridge # Standard-Bridge-Netzwerk verwenden, um via Container-Namen zu kommunizieren

volumes:
  pgdata:

# Docker Desktop muss laufen, um die Container zu starten (Kontrolliert alle Container und Images -> Docker Daemon lokal)