name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Install Playwright & deps
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # Docker Compose Stack starten (Catalog + Order + Postgres)
      - name: Start microservices stack
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 25

      # Health Checks
      - name: Check Order API
        run: |
          until curl -s http://localhost:8081/; do
            echo "Waiting for order-service..."
            sleep 2
          done

      - name: Check Catalog API
        run: |
          until curl -s http://localhost:8080/; do
            echo "Waiting for catalog-service..."
            sleep 2
          done

      # Unit + E2E Tests
      - name: Build & Test (incl. Jacoco)
        run: mvn --batch-mode --update-snapshots verify

      # Docker Image bauen
      - name: Build Docker Image with Buildpacks
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=mladen98/order:latest

      # Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push
      - name: Push Image
        run: docker push mladen98/order:latest

      # Reports
      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco
