name: Order CI #Titel für den Workflow

on: # Trigger für den Workflow
  push: # Bei jedem Push ins Repository (egal welcher Branch)
  pull_request: # Bei jedem Pull Request ins Repository (egal welcher Branch)

jobs: # Definition der Jobs (build, test, deploy, etc.)
  build: # Job läuft auf einem Ubuntu-Linux Runner
    runs-on: ubuntu-latest #Runner Typ

    steps: # Schritte des Jobs
      - uses: actions/checkout@v5 # Code aus dem Repository auschecken

      - name: Set up Java 21 # Einrichtung von Java 21
        uses: actions/setup-java@v4 #Github Action zum Einrichten von Java
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build (skip E2E) # Maven Build & Test ohne E2E Tests
        run: mvn --batch-mode --update-snapshots verify -Dtest=!OrderServiceE2ETest # beinhaltet compile, unittests, integration tests, package, verify
        # OrderServiceE2ETest wird hier übersprungen, da dieser Test die laufenden Microservices benötigt

      - name: Build Docker Image # Build Docker Image mit Buildpacks
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=ksrigganthan/order:latest # Befehl zum Bauen des Docker Images mit Buildpacks

      - name: Docker Login # Login in Docker Hub
        uses: docker/login-action@v3 # Github Action zum Login in Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Docker Hub Username aus GitHub Secrets
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker Hub Token aus GitHub Secrets

      - name: Push Image # Docker Image order pushen
        run: docker push ksrigganthan/order:latest # Image zu Docker Hub pushen

      # Hier müsste Catalog Image schon lokal vorhanden sein, damit Order Image gebaut werden kann (Abhängigkeit in docker-compose.yml)
      - name: Start microservices # Starten der benötigten Microservices via Docker Compose
        run: | # Mehrzeiliger Befehl / Vor dem Starten die Images vom Docker Hub ziehen / Microservices im detached Modus starten / Warten, bis die Microservices hochgefahren sind
          docker compose -f docker-compose.yml pull  
          docker compose -f docker-compose.yml up -d 
          sleep 25

      # Ablauf
      # 30-mal versuchen, ob der Catalog Microservice erreichbar ist (jeder Versuch -> 2 Sekunden warten, max. 1 Minute warten)
      # Curl Befehl sendet eine Anfrage an den Microservice und prüft, ob dieser antwortet
      # -s steht für silent (keine Ausgabe)
      # -f steht für fail (kein Output bei Fehler, 404/500 etc.)
      # /dev/null leitet die Ausgabe weg (wir wollen nur prüfen, ob der Dienst erreichbar ist)
      # echo gibt Statusmeldungen aus
      # exit 0 bedeutet Erfolg, exit 1 bedeutet Fehler
      # fi schließt die if-Bedingung ab
      # echo "Waiting for Catalog..." gibt eine Meldung aus, wenn der Dienst noch nicht erreichbar ist
      # sleep 2 wartet 2 Sekunden, bevor der nächste Versuch gestartet wird
      # exit 1 am Ende signalisiert einen Fehler, wenn der Dienst nach 30 Versuchen nicht erreichbar ist

      - name: Wait for Catalog # Warten, bis der Catalog Microservice erreichbar ist
        run: | 
          for i in {1..30}; do
            if curl -sf http://localhost:8080/books/search > /dev/null; then
              echo "Catalog is up"
              exit 0
            fi
            echo "Waiting for Catalog..."
            sleep 2
          done
          exit 1
          

      # Siehe Erklärung oben
      - name: Wait for Order # Warten, bis der Catalog Microservice erreichbar ist
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8081/ > /dev/null; then
              echo "Order is up"
              exit 0
            fi
            echo "Waiting for Order..."
            sleep 2
          done
          exit 1


      - name: Install Playwright Browsers # Playwright Browser für E2E Tests installieren
        run: npx playwright install --with-deps # --with-deps installiert zusätzlich benötigte Abhängigkeiten im Linux System

      - name: Run Tests (including E2E) # Alle Tests inklusive E2E Tests ausführen
        run: mvn --batch-mode --update-snapshots test # E2E Tests sind jetzt möglich, da die Microservices laufen


      - name: Upload Surefire Reports # Upload der Surefire Reports als Artefakt (Testresultate publizieren)
        if: always() # Immer ausführen, auch wenn vorherige Schritte fehlschlagen
        uses: actions/upload-artifact@v4 # Github Action zum Upload von Artefakten
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Jacoco Coverage # Upload der Jacoco Coverage Reports als Artefakt (Bonus)
        if: always() # Immer ausführen, auch wenn vorherige Schritte fehlschlagen
        uses: actions/upload-artifact@v4 # Github Action zum Upload von Artefakten
        with:
          name: order-coverage
          path: target/site/jacoco
