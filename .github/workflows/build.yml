name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Install Playwright + required system deps
      - name: Install Playwright Browsers
        uses: microsoft/playwright-github-action@v1

      # Build Spring Boot jar without running tests
      - name: Build jar
        run: mvn -DskipTests package

      # Start backend server for E2E tests
      - name: Start backend service
        run: |
          nohup java -jar target/order-0.0.1-SNAPSHOT.jar &
          sleep 10

      # Wait for backend to be reachable on port 8081
      - name: Health check backend
        run: |
          until curl -s http://localhost:8081; do
            echo "Waiting for backend..."
            sleep 2
          done

      # Run ALL tests (incl. E2E with Playwright)
      - name: Build & Test (incl. Jacoco)
        run: mvn --batch-mode --update-snapshots verify

      # Build OCI image with Spring Buildpacks
      - name: Build Docker Image with Buildpacks
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=mladen98/order:latest

      # Authenticate with Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push image
      - name: Push Image to Docker Hub
        run: docker push mladen98/order:latest

      # Upload Surefire reports if tests fail
      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # Upload Jacoco Coverage
      - name: Upload Jacoco Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco
