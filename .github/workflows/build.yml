name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build + Tests (skip E2E)
        run: mvn --batch-mode --update-snapshots verify -DexcludeTests=OrderServiceE2ETest

      - name: Build Docker Image
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=ksrigganthan/order:latest

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ksrigganthan/order:latest

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Jacoco Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco
