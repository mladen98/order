name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ---------------------------
      # 1) Build JAR (sehr wichtig!)
      # ---------------------------
      - name: Package Order JAR
        run: mvn -DskipTests package

      # ---------------------------
      # 2) Build Order Docker Image
      # ---------------------------
      - name: Build Docker Image with Buildpacks
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=ksrigganthan/order:latest

      # ---------------------------
      # 3) Docker Login
      # ---------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------
      # 4) Push Order Image
      # ---------------------------
      - name: Push Order Image
        run: docker push ksrigganthan/order:latest

      # ---------------------------
      # 5) Install Playwright
      # ---------------------------
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # ---------------------------
      # 6) Start Microservices Stack
      # ---------------------------
      - name: Start microservices stack
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 20

      # ---------------------------
      # 7) Health Checks
      # ---------------------------
      - name: Check Catalog API
        run: |
          until curl -s http://localhost:8080; do
            echo "Waiting for catalog-service..."
            sleep 2
          done

      - name: Check Order API
        run: |
          until curl -s http://localhost:8081; do
            echo "Waiting for order-service..."
            sleep 2
          done

      # ---------------------------
      # 8) Run E2E + Unit Tests
      # ---------------------------
      - name: Build & Test (incl. Jacoco)
        run: mvn --batch-mode --update-snapshots verify

      # ---------------------------
      # 9) Upload Reports
      # ---------------------------
      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco
