name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1) Build Order JAR
      - name: Package JAR
        run: mvn -DskipTests package

      # 2) Start Order backend on port 8081
      - name: Start backend
        run: |
          nohup java -jar target/*-SNAPSHOT.jar --server.port=8081 > backend.log 2>&1 &
          echo "Backend starting..."
          sleep 10

      # 3) Wait for backend readiness
      - name: Wait for backend on 8081
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8081/ >/dev/null; then
              echo "Backend is UP"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did NOT start!"
          exit 1

      # 4) Install Playwright
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # 5) Run E2E + Unit Tests
      - name: Run Tests (incl. Jacoco)
        run: mvn --batch-mode --update-snapshots verify

      # 6) Upload logs & reports if something fails
      - name: Upload backend.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco
