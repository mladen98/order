name: Order CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Install Playwright & system dependencies
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # Docker login BEFORE compose (wichtig, sonst kann compose Images nicht ziehen!)
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Start complete microservice stack using Docker Hub images
      - name: Start microservices stack
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 20

      # Health check for Catalog
      - name: Check Catalog API
        run: |
          until curl -s http://localhost:8080; do
            echo "Waiting for catalog-service..."
            sleep 2
          done

      # Health check for Order
      - name: Check Order API
        run: |
          until curl -s http://localhost:8081; do
            echo "Waiting for order-service..."
            sleep 2
          done

      # Unit + E2E Tests (Playwright)
      - name: Build & Test (incl. Jacoco)
        run: mvn --batch-mode --update-snapshots verify

      # Build Docker Image for Order-Service
      - name: Build Docker Image with Buildpacks
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=ksrigganthan/order:latest

      # Push Order Image
      - name: Push Image
        run: docker push ksrigganthan/order:latest

      # Surefire Reports
      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # Jacoco Coverage Upload
      - name: Upload Jacoco Coverage
        uses: actions/upload-artifact@v4
        with:
          name: order-coverage
          path: target/site/jacoco